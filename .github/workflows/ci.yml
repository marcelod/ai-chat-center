name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Development toolchain (vitest 5, jsdom 31) needs Node ^22.22.2 or >=24.15 (package.json engines).
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npm -w ui run typecheck
      - run: npm test
      - run: npm -w ui test
      - run: npm run test:build

  # The committed plugin/dist must be exactly what the build produces, and a dist change since the
  # last release tag needs a version bump (test/core/version.test.ts, which needs the tags).
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and the v* tags: the version guard compares plugin/dist with the last release tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed plugin build must match
        run: |
          git diff --exit-code -- plugin
          untracked="$(git ls-files -o --exclude-standard plugin)"
          if [ -n "$untracked" ]; then echo "untracked build output: $untracked" >&2; exit 1; fi
      - run: npx vitest run test/core/version.test.ts

  # The plugin as Claude Code runs it: whatever Node 18+ is on PATH, no npm install.
  runtime-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Extract with a RELATIVE target: Git Bash's GNU tar reads `D:\...` as a remote host. Outside the
      # checkout, so no node_modules or package.json is around the bundles.
      - name: Extract a git archive of HEAD
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          rm -rf acc && mkdir acc
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C acc
          test -f acc/plugin/dist/hook.mjs && test -f acc/scripts/smoke-flow.mjs
      - name: Runtime smoke (bundles, hooks.json entries, hub)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: node acc/scripts/smoke-runtime.mjs acc
      - name: Flow smoke (/cc, hub spawned by the hook, app message, waiter delivery, /cc off)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: node acc/scripts/smoke-flow.mjs acc
