name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm -w ui test
      - run: npm run test:build
      - name: Committed plugin/dist must match the build
        shell: bash
        run: |
          if [ -n "$(git status --porcelain plugin/dist)" ]; then
            git status --porcelain plugin/dist
            git diff --stat plugin/dist
            echo "plugin/dist is out of date: run npm run build and commit" >&2
            exit 1
          fi
