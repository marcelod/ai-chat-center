version: 2
updates:
  # Pinned action SHAs (with a version comment) are bumped by Dependabot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Dev dependencies only (the plugin ships bundled, with no runtime dependencies): at most two grouped
  # PRs a week instead of one per package: one for every minor and patch update, and one for every major
  # update (kept apart from the first, since majors may need code changes).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]
